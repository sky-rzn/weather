# /etc/nginx/sites-available/weather на vps2.
# Автодеплой этот файл НЕ применяет: после правки скопировать руками,
# затем nginx -t && systemctl reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name meteo-mirijevo.duckdns.org;

    # Обновление сертификата webroot'ом — единственный путь по http.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name meteo-mirijevo.duckdns.org;

    # Статика раздаётся прямо из git-чекаута, который обновляет автодеплой
    root /srv/weather/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /ru {
        try_files /index-ru.html =404;
    }

    location /hwkcvo409fkc {
        try_files /hwkcvo409fkc-index.html =404;
    }

    location = /hwkcvo409fkc-ru {
        try_files /hwkcvo409fkc-index-ru.html =404;
    }

    location = /favicon.png {
        log_not_found off;
        access_log off;
    }

    # API (контейнер weather-api слушает 8001: 8000 на этом хосте занят saucier)
    location /current {
        proxy_pass http://127.0.0.1:8001/current;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    location /24h {
        proxy_pass http://127.0.0.1:8001/24h;
        proxy_set_header Host $host;
        # Кешировать 15 минут — данные не меняются чаще
        add_header Cache-Control "public, max-age=900";
    }

    location /30d {
        proxy_pass http://127.0.0.1:8001/30d;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }

    ssl_certificate /etc/letsencrypt/live/meteo-mirijevo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meteo-mirijevo.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
